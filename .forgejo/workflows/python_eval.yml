name: Python application with evaluation dependencies

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    name: Python Build
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'trigger_pipeline'
    runs-on: ubuntu-24.04

    steps:
      - uses: https://code.forgejo.org/actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: https://github.com/astral-sh/ruff-action@v3.5.1

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v7.1.4
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: "uv.lock"
          github-token: ${{ secrets.GITHUBAUTH }}

      - name: RUFF
        run: uvx ruff check

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install LLVM
        run: |
          sudo apt-get update && \
          sudo apt-get install -y llvm llvm-dev clang libclang-dev libgl1

      - name: Install the project
        run: |
          uv sync --frozen --extra evaluation --extra foreground-background

      - name: Run tests
        env:
          # The suite does not reach MLflow anyway; this makes that guaranteed rather
          # than incidental, so no CI run can write to an experiment store.
          FORGE_SIM_TRACKING: "off"
        run: uv run --frozen python -m unittest discover tests
