[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rebel-shape"
version = "0.1.0"
description = "Perform shape optimization with Mitsuba"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mitsuba>=3.6.4",
    "matplotlib>=3.10.0",
    "cholespy>=2.1.0",
    "gpytoolbox>=0.3.3",
    "jsonpickle>=4.0.2",
    "dataclasses-reverse-cli>=0.0.5",
]

[tool.uv]
prerelease = "allow"
no-build-isolation-package = ["groundingdino"]

[project.optional-dependencies]
extraction = ["groundingdino", "segment-anything"]
azure = [
    "azure-ai-ml>=1.25.0",
    "azureml-mlflow>=1.59.0.post1",
    "debugpy>=1.8.12",
]
azure-local = ["azure-cli>=2.70.0", "azure-ml-utils>=0.0.1"]


[tool.uv.sources]
azure-ml-utils = { path = "../azure-ml-utils", editable = true }
groundingdino = { git = "https://github.com/IDEA-Research/GroundingDINO", rev = "5a890bd867ab0eacb851046c7f5a55cab0e77925" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything", rev = "dca509fe793f601edb92606367a655c15ac00fdf" }

[[tool.uv.dependency-metadata]]
name = "groundingdino"
requires-dist = ["torch", "torchvision", "setuptools"]

[tool.hatch.build.targets.wheel]
packages = ["rebel_shape"]


# RUFF
[tool.ruff]
line-length = 88
indent-width = 4
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E", "F"]
ignore = ["F722", "F821"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
