[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rebel-shape"
version = "0.1.0"
description = "Perform shape optimization with Mitsuba"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mitsuba>=3.8.0",
    "matplotlib>=3.10.0",
    "cholespy>=2.1.0",
    "h5py>=3.11.0",
    "jsonpickle>=4.0.2",
    "dataclasses-reverse-cli>=0.0.5",
    "tyro>=0.9.27",
    "mlflow>=3.7.0",
    "cadquery-ocp>=7.8.1.1.post1",
    "ocp-stubs",
]

[tool.uv]
prerelease = "allow"
environments = ["sys_platform == 'linux'"]
# sam3 requires numpy<2 while scikit-sparse requires numpy>2, so the two extras
# cannot share an environment. Declaring the conflict lets uv resolve each of them
# against its own numpy instead of failing to produce a lockfile at all.
conflicts = [[{ extra = "extraction" }, { extra = "fast-cholesky" }]]

[project.optional-dependencies]
extraction = [
    "einops>=0.8.2",
    "psutil>=7.2.2",
    "pycocotools>=2.0.11",
    "sam3>=0.1.3",
]
azure = [
    "azure-ai-ml>=1.25.0",
    "azureml-mlflow>=1.59.0.post1",
    "debugpy>=1.8.12",
]
azure-local = ["azure-cli>=2.70.0", "azure-ml-utils>=0.0.1"]
evaluation = [
    "open3d>0.18.0",
    "torch>=2.7.1",
    "torchmetrics>=1.8.2",
    "torchvision>=0.22.1",
]
foreground-background = [
    "moge>=2.0.0",
    "scikit-image>=0.25.2",
]
visualization = ["pyqt6>=6.11.0"]
fast-cholesky = ["scikit-sparse>=0.5.0"]
# Pinned rather than bounded below: gpytoolbox remeshes the ground-truth meshes the
# end-to-end verification measures against, so a new release would silently move
# every metric derived from them.
remeshing = ["gpytoolbox==0.3.6"]


[tool.uv.sources]
azure-ml-utils = { path = "../azure-ml-utils", editable = true }
moge = { git = "https://github.com/microsoft/MoGe", rev = "0286b495230a074aadf1c76cc5c679e943e5d1c6" }
ocp-stubs = { git = "https://github.com/CadQuery/OCP-stubs", rev = "e838ff400d5ee2f4a0579d2a713b19311855288f" }
sam3 = { git = "https://github.com/facebookresearch/sam3", rev = "86ed77094094e5cabb16b0414ec60c5ba9ce0a0f" }
# switched to the git version to avoid the decod dependency on arm by not installing any extra
# using this commit because there is a type error with the code SAM3.1 and using SAM3


[tool.hatch.build.targets.wheel]
packages = ["rebel_shape"]


# RUFF
[tool.ruff]
line-length = 88
indent-width = 4
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default. `I` sorts imports the isort way.
select = ["E", "F", "I"]
ignore = ["F722", "F821"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# The three top-level packages of this repository form one first-party group.
known-first-party = ["fem", "main_scripts", "rebel_shape"]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.basedpyright]
typeCheckingMode = "standard"
deprecateTypingAliases = true
